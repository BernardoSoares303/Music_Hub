<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Músicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/crud_musicas.css">

</head>

<body onload="carregarMusicasCrud()">

    <nav class="navbar navbar-dark bg-black">

        <div class="container">

            <a href="index.html" class="navbar-brand">
                Music Hub
            </a>

            <a href="index.html" class="btn btn-custom">
                Voltar
            </a>

        </div>

    </nav>

    <main class="container py-5">

        <h1 class="titulo">
            Gerenciar Músicas
        </h1>

        <!-- FORM -->

        <form id="formMusica" class="form-musica">

            <input type="hidden" id="idMusica">

            <input type="text" id="nome" placeholder="Nome da música" class="form-control" required>

            <input type="text" id="artista" placeholder="Artista" class="form-control" required>

            <input type="text" id="imagem" placeholder="URL da imagem" class="form-control" required>

            <textarea id="descricao" placeholder="Descrição" class="form-control" rows="4" required></textarea>

            <button type="submit" class="btn btn-custom">
                Salvar Música
            </button>

        </form>

        <!-- LISTA -->

        <div class="row mt-5" id="listaMusicasCrud"></div>

    </main>

    <script src="assets/js/app.js"></script>

    <script src="assets/js/crud_musicas.js"></script>

</body>

</html>
