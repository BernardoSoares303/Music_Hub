<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="./assets/css/login.css">

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body>

  <div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

      <!-- LOGIN -->
      <label for="login">Login</label>

      <input 
        type="text" 
        id="login" 
        class="form-control"
        placeholder="Digite seu login"
        required
      >

      <!-- SENHA -->
      <label for="senha">Senha</label>

      <input 
        type="password" 
        id="senha" 
        class="form-control"
        placeholder="Digite sua senha"
        required
      >

      <!-- BOTÃO -->
      <button 
        type="submit" 
        class="btn-custom"
      >
        Entrar
      </button>

    </form>

    <!-- LINK CADASTRO -->
    <p>
      Não possui conta?

      <a href="cadastro_usuario.html">
        Cadastre-se
      </a>
    </p>

  </div>

  <!-- JS -->
  <script src="./assets/js/login.js"></script>

</body>
</html>
